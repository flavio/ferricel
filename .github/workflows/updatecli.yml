name: Updatecli

on:
  schedule:
    # Run once a day at 08:00 UTC
    - cron: "0 8 * * *"
  # Allow manual runs from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TAPLO_VERSION: "0.10.0"

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Updatecli
        uses: updatecli/updatecli-action@41b9c8d707830a9daebaeaa84c1b62d60b779564 # v3.6.0

      - name: Install taplo
        run: |
          set -e
          curl -sSL -o taplo-linux-x86_64.gz "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz"
          echo "$TAPLO_CHECKSUM  taplo-linux-x86_64.gz" | sha256sum -c
          gunzip taplo-linux-x86_64.gz
          sudo mv taplo-linux-x86_64 /usr/local/bin/taplo
          sudo chmod +x /usr/local/bin/taplo
        env:
          TAPLO_CHECKSUM: "8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156"

      - name: Run Updatecli
        run: updatecli pipeline apply --config updatecli/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_GITHUB_USERNAME: ${{ github.actor }}
